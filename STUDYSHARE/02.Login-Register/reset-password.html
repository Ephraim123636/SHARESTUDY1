<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a New Password - ShareStudy</title>
    <link rel="stylesheet" href="../08.Css/style.css?v=20261018-footer-icons">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <h1>Choose a new password</h1>
            <p>Reset links can only be used once and expire after one hour.</p>
            <p id="reset-status" role="status" aria-live="polite"></p>
            <form action="../11.Backend/reset_password.php" method="post">
                <input type="hidden" name="token" id="reset-token">
                <p>
                    <label for="password">New password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                </p>
                <p>
                    <label for="confirm-password">Confirm new password</label>
                    <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" required>
                </p>
                <button type="submit">Save new password</button>
            </form>
            <p class="register-link"><a href="login.html">Back to login</a></p>
        </section>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const tokenField = document.querySelector('#reset-token');
        const form = tokenField.form;
        const status = document.querySelector('#reset-status');
        if (!/^[a-f0-9]{64}$/i.test(token)) {
            form.hidden = true;
            status.textContent = 'This password reset link is invalid or incomplete. Request a new link.';
            status.setAttribute('role', 'alert');
        } else {
            tokenField.value = token;
        }
        form.addEventListener('submit', (event) => {
            const password = document.querySelector('#password');
            const confirmation = document.querySelector('#confirm-password');
            if (password.value !== confirmation.value) {
                event.preventDefault();
                confirmation.setCustomValidity('Passwords do not match.');
                confirmation.reportValidity();
            } else {
                confirmation.setCustomValidity('');
            }
        });
        document.querySelector('#confirm-password').addEventListener('input', (event) => {
            event.currentTarget.setCustomValidity('');
        });
        if (params.get('error') === 'expired') {
            status.textContent = 'This reset link is expired or has already been used. Request a new link.';
            status.setAttribute('role', 'alert');
        } else if (params.get('error') === 'invalid') {
            status.textContent = 'The passwords must match and contain at least 8 characters.';
            status.setAttribute('role', 'alert');
        } else if (params.get('error') === 'server') {
            status.textContent = 'The password could not be changed because of a temporary service error. Please contact the site administrator.';
            status.setAttribute('role', 'alert');
        }
    </script>
</body>
</html>
