<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ShareStudy</title>
    <link rel="stylesheet" href="../08.Css/style.css?v=20261018-footer-icons">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <h1>Reset your password</h1>
            <p>Enter the email address on your ShareStudy account. If it matches an account and email is configured, we will send a one-time reset link.</p>
            <p id="reset-status" role="status" aria-live="polite"></p>
            <form action="../11.Backend/request_password_reset.php" method="post">
                <p>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </p>
                <button type="submit">Send reset link</button>
            </form>
            <p class="register-link"><a href="login.html">Back to login</a></p>
        </section>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const status = document.querySelector('#reset-status');
        if (params.get('sent') === '1') {
            status.textContent = 'If the email matches an account and email delivery is configured, a reset link will arrive shortly. Otherwise, please contact the site administrator.';
        } else if (params.get('error') === 'invalid') {
            status.textContent = 'Enter a valid email address.';
            status.setAttribute('role', 'alert');
        } else if (params.get('error') === 'server') {
            status.textContent = 'The password reset service is temporarily unavailable. Please contact the site administrator.';
            status.setAttribute('role', 'alert');
        }
    </script>
</body>
</html>
